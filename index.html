<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valdara Dressage</title>
  <meta name="description" content="Valdara Dressage — coming soon.">
  <style>
    :root { --bg: #faf8f5; --ink: #2a2622; --muted: #6e655c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161412; --ink: #f2ede7; --muted: #a79d92; }
    }
    :root[data-theme="dark"] { --bg: #161412; --ink: #f2ede7; --muted: #a79d92; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px;
    }
    main { text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; font-weight: 600; letter-spacing: .02em; }
    p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>Valdara Dressage</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
